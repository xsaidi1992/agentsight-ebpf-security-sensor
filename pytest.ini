# [BESOIN T] Configuration centrale de la stratégie de tests du Technical Assessment.
[pytest]
# [BESOIN T] Limite la découverte automatique au répertoire de preuves automatisées.
testpaths = tests
# [BESOIN B/C/D/E/P/T] Sépare clairement les tests privilégiés, E2E et de build natif.
markers =
    kernel: requires Linux BTF, libbpf, tracepoints and BPF capabilities
    e2e: end-to-end kernel-to-API/session integration
    build: requires the complete native eBPF build toolchain
# [BESOIN T] Affiche les raisons de skip et le résumé détaillé des résultats.
addopts = -ra
